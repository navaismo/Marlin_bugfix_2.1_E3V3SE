#
# Marlin Firmware
# Test: STM32F103RE_creality/config-08.ini
#
# Ender-3 V2 - FT Motion resonance with PIS v1/v2 host events and optional progress
#

[config:base]
ini_use_config                           = example/Creality/Ender-3 V2/CrealityV422/CrealityUI
ft_motion                               = on
ftm_shaper_zv                           = on
resonance_test                          = on
emergency_parser                        = on
pinput_resonance_events                  = on
pinput_resonance_progress                = on
