# Publishes only the standalone /website folder. Does not build or modify Marlin.
name: Deploy User Guide

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Version website assets
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import re

          root = Path('website')
          page = root / 'index.html'
          html = page.read_text()
          for name in ('app.js', 'styles.css', 'theme-navy.css'):
              version = hashlib.sha256((root / name).read_bytes()).hexdigest()[:12]
              pattern = r'((?:src|href)=")' + re.escape(name) + r'(?:\?[^"\s]*)?"'
              html, count = re.subn(pattern, lambda match: f'{match[1]}{name}?v={version}"', html)
              assert count == 1, f'Expected one HTML reference to {name}, found {count}'
          page.write_text(html)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
