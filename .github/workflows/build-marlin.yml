name: Build Custom Marlin 2.1.x E3V3SE Firmware 

on:
  workflow_dispatch:
    inputs:
      env:
        description: "PlatformIO environment to compile"
        required: true
        type: choice
        default: "STM32F401RE_creality"
        options:
          - STM32F401RE_creality

      x_routine_auto_offset:
        description: "X_ROUTINE_AUTO_OFFSET (Z offset with X pattern)"
        required: true
        type: boolean
        default: false

      d_routine_auto_offset:
        description: "D_ROUTINE_AUTO_OFFSET (Z offset with Delta pattern)"
        required: true
        type: boolean
        default: false

      dwin_render_thumbnail:
        description: "DWIN_RENDER_THUMBNAIL (render thumbnail on LCD)"
        required: true
        type: boolean
        default: true

      dwin_dimm_menu:
        description: "DWIN_DIMM_MENU (brightness/dimm menu on LCD)"
        required: true
        type: boolean
        default: true

      dwin_zhome_menu:
        description: "DWIN_ZHOME_MENU (Z menu after homing)"
        required: true
        type: boolean
        default: true

      extra_preheat_labels:
        description: "EXTRA_PREHEAT_LABELS (extra preheats)"
        required: true
        type: boolean
        default: true

      dwin_custom_extrude:
        description: "DWIN_CUSTOM_EXTRUDE (custom extrusion menu)"
        required: true
        type: boolean
        default: true

      skew_correction:
        description: "SKEW_CORRECTION (skew correction)"
        required: true
        type: boolean
        default: false

      dwin_skew_menu:
        description: "DWIN_SKEW_MENU (skew menu)"
        required: true
        type: boolean
        default: false

      input_shaping_x:
        description: "INPUT_SHAPING_X"
        required: true
        type: boolean
        default: false

      input_shaping_y:
        description: "INPUT_SHAPING_Y"
        required: true
        type: boolean
        default: false

      dwin_input_shaping_menu:
        description: "DWIN_INPUT_SHAPING_MENU (Input Shaping menu)"
        required: true
        type: boolean
        default: false

      one_click_print:
        description: "ONE_CLICK_PRINT"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Apply firmware options
        run: |
          python .github/scripts/apply_marlin_options.py \
            --x_routine_auto_offset "${{ github.event.inputs.x_routine_auto_offset }}" \
            --d_routine_auto_offset "${{ github.event.inputs.d_routine_auto_offset }}" \
            --dwin_render_thumbnail "${{ github.event.inputs.dwin_render_thumbnail }}" \
            --dwin_dimm_menu "${{ github.event.inputs.dwin_dimm_menu }}" \
            --dwin_zhome_menu "${{ github.event.inputs.dwin_zhome_menu }}" \
            --extra_preheat_labels "${{ github.event.inputs.extra_preheat_labels }}" \
            --dwin_custom_extrude "${{ github.event.inputs.dwin_custom_extrude }}" \
            --skew_correction "${{ github.event.inputs.skew_correction }}" \
            --dwin_skew_menu "${{ github.event.inputs.dwin_skew_menu }}" \
            --input_shaping_x "${{ github.event.inputs.input_shaping_x }}" \
            --input_shaping_y "${{ github.event.inputs.input_shaping_y }}" \
            --dwin_input_shaping_menu "${{ github.event.inputs.dwin_input_shaping_menu }}" \
            --one_click_print "${{ github.event.inputs.one_click_print }}"
      - name: Compile firmware
        run: |
          pio run -e "${{ github.event.inputs.env }}"

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.inputs.env }}
          path: |
            .pio/build/${{ github.event.inputs.env }}/firmware*.bin
            .pio/build/${{ github.event.inputs.env }}/*.bin
          retention-days: 1  
          if-no-files-found: error
